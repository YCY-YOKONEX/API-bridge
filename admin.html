<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IM 服务管理后台</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .header {
      background: white;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .header h1 {
      font-size: 28px;
      color: #2d3748;
      margin-bottom: 8px;
    }

    .header .subtitle {
      color: #718096;
      font-size: 14px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 20px;
    }

    .stat-card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .stat-card .label {
      color: #718096;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .stat-card .value {
      font-size: 32px;
      font-weight: bold;
      color: #2d3748;
    }

    .stat-card .indicator {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 6px;
    }

    .indicator.online {
      background: #48bb78;
      animation: pulse 2s infinite;
    }

    .indicator.offline {
      background: #fc8181;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .main-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }

    @media (max-width: 768px) {
      .main-grid {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .card h2 {
      font-size: 20px;
      color: #2d3748;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 2px solid #e2e8f0;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      color: #4a5568;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 8px;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 10px 12px;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      font-size: 14px;
      transition: border-color 0.2s;
    }

    .form-group input:focus,
    .form-group select:focus {
      outline: none;
      border-color: #667eea;
    }

    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: #667eea;
      color: white;
    }

    .btn-primary:hover {
      background: #5568d3;
    }

    .btn-danger {
      background: #fc8181;
      color: white;
    }

    .btn-danger:hover {
      background: #f56565;
    }

    .btn-success {
      background: #48bb78;
      color: white;
    }

    .btn-success:hover {
      background: #38a169;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .sessions-list {
      max-height: 400px;
      overflow-y: auto;
    }

    .session-item {
      padding: 16px;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      margin-bottom: 12px;
      transition: border-color 0.2s;
    }

    .session-item:hover {
      border-color: #cbd5e0;
    }

    .session-item.active {
      border-color: #667eea;
      background: #f7fafc;
    }

    .session-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .session-header .user-id {
      font-weight: 600;
      color: #2d3748;
      font-size: 16px;
    }

    .session-header .status-badge {
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 500;
    }

    .status-badge.ready {
      background: #c6f6d5;
      color: #22543d;
    }

    .status-badge.not-ready {
      background: #fed7d7;
      color: #742a2a;
    }

    .session-info {
      font-size: 13px;
      color: #718096;
      margin-bottom: 12px;
    }

    .session-actions {
      display: flex;
      gap: 8px;
    }

    .session-actions .btn {
      padding: 6px 12px;
      font-size: 13px;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #a0aec0;
    }

    .empty-state svg {
      width: 64px;
      height: 64px;
      margin-bottom: 16px;
      opacity: 0.5;
    }

    .log-container {
      background: #2d3748;
      color: #e2e8f0;
      border-radius: 8px;
      padding: 16px;
      max-height: 300px;
      overflow-y: auto;
      font-family: 'Courier New', monospace;
      font-size: 12px;
    }

    .log-entry {
      margin-bottom: 8px;
      line-height: 1.5;
    }

    .log-entry .timestamp {
      color: #90cdf4;
    }

    .log-entry.info {
      color: #9ae6b4;
    }

    .log-entry.error {
      color: #fc8181;
    }

    .log-entry.success {
      color: #68d391;
    }

    .alert {
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 14px;
    }

    .alert-success {
      background: #c6f6d5;
      color: #22543d;
      border: 1px solid #9ae6b4;
    }

    .alert-error {
      background: #fed7d7;
      color: #742a2a;
      border: 1px solid #fc8181;
    }

    .alert-info {
      background: #bee3f8;
      color: #2c5282;
      border: 1px solid #90cdf4;
    }

    .loading {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid #e2e8f0;
      border-top-color: #667eea;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .connection-status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      color: #4a5568;
    }

    .security-warning {
      background: linear-gradient(135deg, #fc8181 0%, #f56565 100%);
      color: white;
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 20px;
      box-shadow: 0 4px 6px rgba(252, 129, 129, 0.3);
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 14px;
    }

    .security-warning .icon {
      font-size: 24px;
      flex-shrink: 0;
    }

    .security-warning .content {
      flex: 1;
    }

    .security-warning .title {
      font-weight: 600;
      margin-bottom: 4px;
    }

    .security-warning a {
      color: white;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <h1>🎮 IM 服务管理后台</h1>
      <p class="subtitle">多用户并发安全管理系统 v2.0</p>
      <div class="connection-status" style="margin-top: 12px;">
        <span class="indicator offline" id="wsIndicator"></span>
        <span id="wsStatus">正在连接...</span>
      </div>
    </div>

    <!-- Security Warning -->
    <div class="security-warning">
      <div class="icon">⚠️</div>
      <div class="content">
        <div class="title">安全提示</div>
        <div>这是管理后台，包含敏感操作。生产环境必须配置访问保护（HTTP基本认证、HTTPS等）。
          详见 <a href="https://github.com/your-repo/blob/main/SECURITY.md" target="_blank">SECURITY.md</a>
        </div>
      </div>
    </div>

    <!-- Stats -->
    <div class="stats">
      <div class="stat-card">
        <div class="label">活跃会话</div>
        <div class="value" id="totalSessions">0</div>
      </div>
      <div class="stat-card">
        <div class="label">最大会话数</div>
        <div class="value" id="maxSessions">-</div>
      </div>
      <div class="stat-card">
        <div class="label">WebSocket 连接</div>
        <div class="value" id="wsConnections">0</div>
      </div>
      <div class="stat-card">
        <div class="label">服务状态</div>
        <div class="value" style="font-size: 24px; color: #48bb78;">
          <span class="indicator online" id="serviceIndicator"></span>运行中
        </div>
      </div>
    </div>

    <!-- Main Grid -->
    <div class="main-grid">
      <!-- Login Form -->
      <div class="card">
        <h2>🔐 用户登录</h2>
        <div id="loginAlert"></div>
        <form id="loginForm">
          <div class="form-group">
            <label>用户 ID (UID)</label>
            <input type="text" id="uid" placeholder="输入用户 ID" required>
          </div>
          <div class="form-group">
            <label>Token</label>
            <input type="text" id="token" placeholder="输入用户 Token" required>
          </div>
          <button type="submit" class="btn btn-primary" style="width: 100%;">
            <span id="loginBtnText">登录并创建会话</span>
          </button>
        </form>
      </div>

      <!-- Send Command -->
      <div class="card">
        <h2>📤 发送指令</h2>
        <div id="commandAlert"></div>
        <form id="commandForm">
          <div class="form-group">
            <label>选择会话</label>
            <select id="sessionSelect" required>
              <option value="">请先登录创建会话</option>
            </select>
          </div>
          <div class="form-group">
            <label>指令 ID</label>
            <input type="text" id="commandId" placeholder="输入指令 ID" required>
          </div>
          <button type="submit" class="btn btn-success" style="width: 100%;">
            <span id="commandBtnText">发送指令</span>
          </button>
        </form>
      </div>
    </div>

    <!-- Sessions List -->
    <div class="card">
      <h2>👥 活跃会话列表</h2>
      <div id="sessionsList" class="sessions-list"></div>
    </div>

    <!-- Activity Log -->
    <div class="card">
      <h2>📋 活动日志</h2>
      <div class="log-container" id="logContainer"></div>
    </div>
  </div>

  <script>
    // ==========================================
    // API 配置
    // ==========================================
    // 本地开发使用：
    const API_BASE = 'http://localhost:3001';
    const WS_URL = 'ws://localhost:3001';

    // 生产环境请修改为实际地址：
    // const API_BASE = 'http://your-server-ip:8080';
    // const WS_URL = 'ws://your-server-ip:8080';
    // ==========================================

    // 全局状态
    let ws = null;
    let sessions = [];
    let selectedSession = null;

    // 初始化
    window.addEventListener('DOMContentLoaded', () => {
      initWebSocket();
      loadSessions();
      setupEventListeners();
    });

    // WebSocket 连接
    function initWebSocket() {
      try {
        ws = new WebSocket(WS_URL);

        ws.onopen = () => {
          updateWSStatus(true);
          addLog('WebSocket 连接成功', 'success');
        };

        ws.onmessage = (event) => {
          const data = JSON.parse(event.data);
          handleWSMessage(data);
        };

        ws.onerror = (error) => {
          updateWSStatus(false);
          addLog('WebSocket 连接错误', 'error');
        };

        ws.onclose = () => {
          updateWSStatus(false);
          addLog('WebSocket 连接已关闭，5秒后重连...', 'info');
          setTimeout(initWebSocket, 5000);
        };
      } catch (error) {
        updateWSStatus(false);
        addLog('WebSocket 初始化失败: ' + error.message, 'error');
      }
    }

    // 处理 WebSocket 消息
    function handleWSMessage(data) {
      switch (data.type) {
        case 'connected':
          addLog('已连接到服务器', 'info');
          loadSessions();
          break;
        case 'status':
          addLog(`会话 ${data.userId} 状态更新: ${data.data.event}`, 'info');
          loadSessions();
          break;
        case 'heartbeat':
          updateStats(data.data.stats);
          break;
        case 'loginResult':
          if (data.success) {
            showAlert('loginAlert', data.message, 'success');
            addLog(`登录成功: ${data.data.userId}`, 'success');
            loadSessions();
          } else {
            showAlert('loginAlert', data.message, 'error');
            addLog(`登录失败: ${data.message}`, 'error');
          }
          break;
        case 'commandResult':
          if (data.success) {
            showAlert('commandAlert', '指令发送成功', 'success');
            addLog('指令发送成功', 'success');
          } else {
            showAlert('commandAlert', data.message, 'error');
            addLog(`指令发送失败: ${data.message}`, 'error');
          }
          break;
      }
    }

    // 更新 WebSocket 状态
    function updateWSStatus(connected) {
      const indicator = document.getElementById('wsIndicator');
      const status = document.getElementById('wsStatus');
      if (connected) {
        indicator.className = 'indicator online';
        status.textContent = '已连接';
      } else {
        indicator.className = 'indicator offline';
        status.textContent = '未连接';
      }
    }

    // 更新统计信息
    function updateStats(stats) {
      if (stats) {
        document.getElementById('totalSessions').textContent = stats.totalSessions || 0;
        document.getElementById('maxSessions').textContent = stats.maxSessions || '-';
        document.getElementById('wsConnections').textContent = stats.wsConnections || 0;
      }
    }

    // 加载会话列表
    async function loadSessions() {
      try {
        const response = await fetch(`${API_BASE}/health`);
        const data = await response.json();

        sessions = data.stats.sessions || [];
        updateStats(data.stats);
        renderSessions();
        updateSessionSelect();
      } catch (error) {
        addLog('加载会话列表失败: ' + error.message, 'error');
      }
    }

    // 渲染会话列表
    function renderSessions() {
      const container = document.getElementById('sessionsList');

      if (sessions.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path>
            </svg>
            <p>暂无活跃会话</p>
            <p style="font-size: 12px; margin-top: 8px;">请在左侧登录创建新会话</p>
          </div>
        `;
        return;
      }

      container.innerHTML = sessions.map(session => `
        <div class="session-item ${selectedSession === session.userId ? 'active' : ''}"
             onclick="selectSession('${session.userId}')">
          <div class="session-header">
            <span class="user-id">${session.userId}</span>
            <span class="status-badge ${session.isReady ? 'ready' : 'not-ready'}">
              ${session.isReady ? '✓ 就绪' : '⏳ 未就绪'}
            </span>
          </div>
          <div class="session-info">
            <div>UID: ${session.uid}</div>
            <div>创建时间: ${new Date(session.createdAt).toLocaleString('zh-CN')}</div>
            <div>最后访问: ${new Date(session.lastAccessTime).toLocaleString('zh-CN')}</div>
            <div>存活时长: ${formatDuration(session.age)}</div>
          </div>
          <div class="session-actions">
            <button class="btn btn-primary" onclick="event.stopPropagation(); sendCommandToSession('${session.userId}')">
              发送指令
            </button>
            <button class="btn btn-danger" onclick="event.stopPropagation(); logoutSession('${session.userId}')">
              登出
            </button>
          </div>
        </div>
      `).join('');
    }

    // 更新会话选择器
    function updateSessionSelect() {
      const select = document.getElementById('sessionSelect');
      if (sessions.length === 0) {
        select.innerHTML = '<option value="">请先登录创建会话</option>';
      } else {
        select.innerHTML = sessions.map(session => `
          <option value="${session.userId}">${session.userId} (${session.isReady ? '就绪' : '未就绪'})</option>
        `).join('');
      }
    }

    // 选择会话
    function selectSession(userId) {
      selectedSession = userId;
      renderSessions();
      document.getElementById('sessionSelect').value = userId;
    }

    // 发送指令到指定会话
    function sendCommandToSession(userId) {
      document.getElementById('sessionSelect').value = userId;
      document.getElementById('commandId').focus();
    }

    // 登出会话
    async function logoutSession(userId) {
      if (!confirm(`确定要登出会话 ${userId} 吗？`)) return;

      try {
        const response = await fetch(`${API_BASE}/api/logout`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userId })
        });

        const data = await response.json();
        if (data.success) {
          addLog(`会话 ${userId} 已登出`, 'success');
          loadSessions();
        } else {
          addLog(`登出失败: ${data.message}`, 'error');
        }
      } catch (error) {
        addLog('登出请求失败: ' + error.message, 'error');
      }
    }

    // 事件监听器
    function setupEventListeners() {
      // 登录表单
      document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const uid = document.getElementById('uid').value.trim();
        const token = document.getElementById('token').value.trim();

        const btn = document.getElementById('loginBtnText');
        btn.innerHTML = '<span class="loading"></span>登录中...';
        document.querySelector('#loginForm button').disabled = true;

        try {
          const response = await fetch(`${API_BASE}/api/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ uid, token })
          });

          const data = await response.json();
          if (data.success) {
            showAlert('loginAlert', data.message, 'success');
            addLog(`登录成功: ${data.data.userId}`, 'success');
            loadSessions();
            document.getElementById('loginForm').reset();
          } else {
            showAlert('loginAlert', data.message, 'error');
            addLog(`登录失败: ${data.message}`, 'error');
          }
        } catch (error) {
          showAlert('loginAlert', '登录请求失败: ' + error.message, 'error');
          addLog('登录请求失败: ' + error.message, 'error');
        } finally {
          btn.textContent = '登录并创建会话';
          document.querySelector('#loginForm button').disabled = false;
        }
      });

      // 发送指令表单
      document.getElementById('commandForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const userId = document.getElementById('sessionSelect').value;
        const commandId = document.getElementById('commandId').value.trim();

        if (!userId) {
          showAlert('commandAlert', '请选择一个会话', 'error');
          return;
        }

        const btn = document.getElementById('commandBtnText');
        btn.innerHTML = '<span class="loading"></span>发送中...';
        document.querySelector('#commandForm button').disabled = true;

        try {
          const response = await fetch(`${API_BASE}/api/send-command`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ userId, commandId })
          });

          const data = await response.json();
          if (data.success) {
            showAlert('commandAlert', '指令发送成功', 'success');
            addLog(`指令发送成功: ${commandId} -> ${userId}`, 'success');
            document.getElementById('commandId').value = '';
          } else {
            showAlert('commandAlert', data.message, 'error');
            addLog(`指令发送失败: ${data.message}`, 'error');
          }
        } catch (error) {
          showAlert('commandAlert', '发送请求失败: ' + error.message, 'error');
          addLog('发送请求失败: ' + error.message, 'error');
        } finally {
          btn.textContent = '发送指令';
          document.querySelector('#commandForm button').disabled = false;
        }
      });
    }

    // 显示提示
    function showAlert(elementId, message, type) {
      const element = document.getElementById(elementId);
      element.innerHTML = `<div class="alert alert-${type}">${message}</div>`;
      setTimeout(() => {
        element.innerHTML = '';
      }, 5000);
    }

    // 添加日志
    function addLog(message, type = 'info') {
      const container = document.getElementById('logContainer');
      const timestamp = new Date().toLocaleTimeString('zh-CN');
      const entry = document.createElement('div');
      entry.className = `log-entry ${type}`;
      entry.innerHTML = `<span class="timestamp">[${timestamp}]</span> ${message}`;
      container.insertBefore(entry, container.firstChild);

      // 保持最多 50 条日志
      while (container.children.length > 50) {
        container.removeChild(container.lastChild);
      }
    }

    // 格式化时长
    function formatDuration(ms) {
      const seconds = Math.floor(ms / 1000);
      const minutes = Math.floor(seconds / 60);
      const hours = Math.floor(minutes / 60);
      const days = Math.floor(hours / 24);

      if (days > 0) return `${days}天 ${hours % 24}小时`;
      if (hours > 0) return `${hours}小时 ${minutes % 60}分钟`;
      if (minutes > 0) return `${minutes}分钟 ${seconds % 60}秒`;
      return `${seconds}秒`;
    }

    // 定期刷新会话列表
    setInterval(loadSessions, 30000);
  </script>
</body>
</html>
